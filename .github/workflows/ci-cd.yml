name: CI-CD WarungKu Stok

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build dan uji container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env
        run: cp .env.example .env
      - name: Build dan jalankan container
        run: docker compose up -d --build
      - name: Tunggu web healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' warungku_web)
            echo "web: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Uji halaman login
        run: curl -fsS http://localhost:5000/login > /dev/null
      - name: Uji akses tanpa login diarahkan ke login
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          echo "HTTP $code"
          [ "$code" = "302" ]
      - name: Bersihkan
        if: always()
        run: docker compose down -v

  cd:
    name: Publikasi image ke Docker Hub
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warungku-stok:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warungku-stok:${{ github.sha }}

 
          
